name: passa-la

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-7350}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    user: www-data
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: postgis/postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-passa}
      POSTGRES_USER: ${DB_USERNAME:-passa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-passa}
    volumes:
      - db:/var/lib/postgresql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro

volumes:
  db:
